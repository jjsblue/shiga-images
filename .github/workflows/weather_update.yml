name: 自動更新志賀高原雪況與纜車狀態

on:
  schedule:
    # UTC 22:45 = 日本時間 07:45 / 台灣時間 06:45 (晨間天氣與積雪更新)
    # UTC 23:45 = 日本時間 08:45 / 台灣時間 07:45 (首班纜車運行狀態確認)
    # UTC 07:45 = 日本時間 16:45 / 台灣時間 15:45 (傍晚夜滑開放最終確認)
    - cron: '45 22,23,7 * * *'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動點擊執行測試

permissions:
  contents: write # 確保機器人有權限將 ski_weather.json 寫回倉庫

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      # 1. 簽出儲存庫
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝爬蟲所需套件 (requests 與 beautifulsoup4)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. 執行雪況與纜車抓取腳本
      - name: Run weather scraper
        run: |
          python fetch_ski_weather.py

     # 5. 檢查檔案是否有更新，若有則先同步遠端最新版本再推送
      - name: Commit and push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ski_weather.json
          if git diff --staged --quiet; then
            echo "雪況與纜車資料無變更，跳過推送"
          else
            git commit -m "chore: 自動更新志賀高原雪場天氣與纜車狀態 [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
